<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Café | Diagnostic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-logos">
            <img src="images/Bloc_Logo_IUT.jpg" alt="Logo IUT" class="logo-img">
            <img src="images/Bloc_Logo_Info.png" alt="Logo Informatique" class="logo-img">        </div>

        <div class="header-title">Repair Café</div>

        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html">S'inscrire</a></li>
                <li><a href="diagnostic.html">Diagnostic / RDV</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="don.html" class="btn-don">Recyclage</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-content">
        <div class="form-container">
            <h2>Mon objet est-il réparable ?</h2>
            <p>Décrivez votre problème, nos réparateurs vous donneront un premier avis.</p>
            
            <form action="#" method="POST" class="classic-form">
                <div class="form-group">
                    <label for="nom">Nom et prénom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="type-objet">Type d'objet (ex: Téléphone, Ordinateur...)</label>
                    <input type="text" id="type-objet" name="type-objet" required>
                </div>
                <div class="form-group">
                    <label for="description">Description de la panne (référence, année,...)</label>
                    <textarea id="description" name="description" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label for="photo">Joindre une photo (Optionnel)</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Envoyer la demande</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Repair Café. Tous droits réservés.</p>
    </footer>

</body>
</html>
